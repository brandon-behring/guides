# Cloudflare Workers (static assets) config — guides.brandon-behring.dev (hub repo).
#
# Deployed via Workers Builds (Git-connected). Converted from a Pages config
# 2026-06-11: Cloudflare's dashboard no longer offers Pages project creation on
# this account (Workers-only flow), so the launch uses Workers static assets.
# Runbook: docs/deploy-cloudflare-pages.md.
#
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy   (Workers Builds default)
#   Node version:   22 (auto-detected by Workers Builds; Astro 6 requires >=22.12.0)
#
# Phase L1 deliverable: path proxy
#   guides.brandon-behring.dev/ai-engineering/* → guides-ai-engineering worker
# (pilot /experimentation/* proxy follows the same pattern when that guide ships).

name = "guides-hub"
compatibility_date = "2026-05-19"
main = "_worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the Worker first only for the AI-engineering path; everything else serves the
# hub's own static assets directly. The Worker (./_worker.js) proxies /ai-engineering/*
# to the guides-ai-engineering Worker via the service binding below — the L1 path proxy.
run_worker_first = ["/ai-engineering", "/ai-engineering/*"]

[[services]]
binding = "GUIDE_AI_ENGINEERING"
service = "guides-ai-engineering"
