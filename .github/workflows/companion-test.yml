# companion-test.yml — Phase 1 SKETCH (not active).
#
# This workflow activates when the hub repo gains a companion/ Python package.
# Currently the hub does NOT host companion code (per-guide repos do). This
# file is present so Phase 1 retrospective work has a template to adapt per
# design doc v0.2 §18.2.
#
# To activate (Phase 1+):
#   1. Add companion/ subdirectory with pyproject.toml + tests/
#   2. Uncomment the `jobs:` block below
#   3. Add `companion/` to path filters in the `on:` block

name: companion-test

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-test.yml'
  pull_request:
    paths:
      - 'companion/**'

