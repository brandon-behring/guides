# companion-test.yml — Phase 1 SKETCH (intentionally dormant).
#
# Activates when the hub repo gains a companion/ Python package. Currently the
# hub does NOT host companion code (per-guide repos do); see design doc v0.2
# §18.2. The real job template is preserved (commented) at the bottom.
#
# The `not-active` job exists only so this is a VALID workflow file: an `on:`
# block with no `jobs:` registers as an invalid-workflow failure on every push.
# It never runs (`if: false`) and the path filters keep it dormant regardless.
#
# To activate (Phase 1+):
#   1. Add companion/ subdirectory with pyproject.toml + tests/
#   2. Replace the `not-active` job with the template at the bottom
#   3. Keep `companion/` in the path filters

name: companion-test

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-test.yml'
  pull_request:
    paths:
      - 'companion/**'

jobs:
  not-active:
    if: ${{ false }} # dormant placeholder — see header
    runs-on: ubuntu-latest
    steps:
      - run: echo "companion-test is a Phase 1 sketch — not active yet."

