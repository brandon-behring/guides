# companion-test.yml — Phase 1 SKETCH (inert until the hub gains a companion/ package).
#
# The hub does NOT host companion code (per-guide repos do; template here per design
# doc v0.2 §18.2). A GitHub workflow with no jobs is invalid and fails at startup (0s)
# on every push, regardless of the paths filter — so this file carries one no-op
# `sketch` job to stay valid. The path filter below keeps it from running on normal
# pushes/PRs.
#
# To activate (Phase 1+): add companion/ (pyproject.toml + tests/), add `companion/` to
# the path filters, and replace the `sketch` job with the real job template at the bottom.

name: companion-test

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-test.yml'
  pull_request:
    paths:
      - 'companion/**'

jobs:
  sketch:
    runs-on: ubuntu-latest
    steps:
      - run: echo "companion-test is a Phase 1 sketch — the hub has no companion/ yet; see the header to activate."

