# capstone-test.yml — Phase 1.5 SKETCH (inert until the hub gains a capstone/ artifact).
#
# The hub does NOT host capstone code (per-guide repos do, and only arc-relevant
# guides require capstones — pilot is domain-pedagogy tier per design doc v0.2 §10.6.5).
# A GitHub workflow with no jobs is invalid and fails at startup (0s) on every push,
# regardless of the paths filter — so this file carries one no-op `sketch` job to stay
# valid. The path filter below keeps it from running on normal pushes/PRs.
#
# To activate (Phase 1.5+): add capstone/ (pyproject.toml + src/ + evals/) and replace
# the `sketch` job with the real job template at the bottom.

name: capstone-test

on:
  push:
    branches: [main]
    paths:
      - 'capstone/**'
      - '.github/workflows/capstone-test.yml'
  pull_request:
    paths:
      - 'capstone/**'

jobs:
  sketch:
    runs-on: ubuntu-latest
    steps:
      - run: echo "capstone-test is a Phase 1.5 sketch — the hub has no capstone/ yet; see the header to activate."

